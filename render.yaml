services:
  - type: web
    name: accesspdf-api
    runtime: docker
    region: ohio          # pick the region closest to your users
    # Standard = 2GB RAM / 1 CPU. Starter and free are only 512MB, which OOMs
    # under the Java (OpenDataLoader) + Tesseract OCR + Python PDF workload.
    plan: 1c-2g
    rootDir: .
    healthCheckPath: /health/ready
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    envVars:
      - key: DISABLE_AUTH
        value: "false"
      - key: DEPLOYMENT_MODE
        value: "trial"
      - key: DEBUG
        value: "false"
      - key: SECRET_KEY
        generateValue: true        # Render auto-generates a secure random value
      - key: CORS_ALLOW_ALL
        value: "false"
      - key: CORS_ORIGINS_LIST
        value: "https://pdfaccess.org"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOLER_HOST
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_PROJECT_REF
        sync: false
      - key: SUPABASE_ORIGINALS_BUCKET
        sync: false
      - key: SUPABASE_RESULTS_BUCKET
        sync: false
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: OUTPUT_DIR
        value: /tmp/output
      # OpenDataLoader (Java) loads the whole PDF in memory; 128m OOMs on real
      # documents and breaks text extraction, leaving output PDFs untagged and
      # inaccessible. 1g is safe on the Standard plan's 2GB envelope alongside
      # Python + OCR. If you stay on Starter/free (512MB), drop this to -Xmx256m.
      - key: _JAVA_OPTIONS
        value: "-Xmx512m"
      # Uncomment and fill in when you have real SSO credentials:
      # - key: OIDC_CLIENT_ID
      #   sync: false
      # - key: OIDC_CLIENT_SECRET
      #   sync: false
      # - key: OIDC_DISCOVERY_URL
      #   sync: false
