name: CORS settings regression

on:
  pull_request:
    paths:
      - 'backend/config.py'
      - 'backend/tests/test_cors_settings_sources.py'
      - 'backend/requirements.txt'
      - '.github/workflows/cors-settings.yml'

permissions:
  contents: read

jobs:
  cors-settings-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install declared settings and ASGI test dependencies
        run: python -m pip install pytest==8.0.0 fastapi==0.109.0 pydantic==2.6.0 pydantic-settings==2.1.0 python-dotenv==1.0.0
      - name: Test exact pull request head without project credentials
        run: python -m pytest backend/tests/test_cors_settings_sources.py -q -p no:cacheprovider
