version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=development_secret_key_change_me_in_production
      - DATABASE_URL=sqlite:////app/uploads/wcag_platform.db
      - RETENTION_PERIOD_HOURS=12
      - CORS_ORIGINS_LIST=http://localhost:3000,http://localhost:5173
    volumes:
      - uploads_data:/app/uploads
      - output_data:/app/output
    restart: unless-stopped

volumes:
  uploads_data:
  output_data:
