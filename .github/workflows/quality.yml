name: Quality

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    # Playwright 1.41 uses the Ubuntu 22.04 browser dependency names.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.18
      - run: bash scripts/codex-cloud-setup.sh
      - run: uv run --frozen --project backend pytest backend/tests -q
        env:
          DISABLE_AUTH: 'true'
          DEPLOYMENT_MODE: testing
      - run: python scripts/validate_deployment.py deployment/trial.env.example deployment/testing.env.example
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test -- --run
      - run: npm --prefix frontend run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: docker build -t pdfaccess-ci .
      - name: Verify container readiness
        run: |
          set -euo pipefail
          docker run -d --name pdfaccess-ci -p 8000:8000 -e DISABLE_AUTH=true -e DEPLOYMENT_MODE=testing pdfaccess-ci
          trap 'docker logs pdfaccess-ci; docker rm -f pdfaccess-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health/ready; then exit 0; fi
            sleep 2
          done
          exit 1
