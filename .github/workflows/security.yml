name: Dependency security

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python -m pip install uv==0.11.18 pip-audit==2.10.0
      - run: uv sync --frozen --project backend
      - run: npm ci --prefix frontend
      - name: Audit locked Python dependencies
        id: python-audit
        continue-on-error: true
        run: pip-audit --path backend/.venv/lib/python3.12/site-packages --format json --output backend-audit.json
      - name: Audit frontend dependencies
        id: node-audit
        continue-on-error: true
        run: npm --prefix frontend audit --audit-level=high --json > frontend-audit.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: dependency-audits
          path: '*-audit.json'
          retention-days: 14
      - name: Require successful audits for release
        if: steps.python-audit.outcome != 'success' || steps.node-audit.outcome != 'success'
        run: exit 1
